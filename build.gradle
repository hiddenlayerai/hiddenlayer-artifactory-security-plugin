plugins {
    id 'groovy'
    id 'com.gradleup.shadow' version '8.3.9'
}

group = 'com.hiddenlayer.artifactory.plugin'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.apache.groovy:groovy-all:4.0.23'
    implementation 'com.hiddenlayer.api:hiddenlayer-java:1.0.0'
    implementation 'com.hiddenlayer.api:hiddenlayer-java-client-okhttp:1.0.0'
    implementation 'com.hiddenlayer.api:hiddenlayer-java-core:1.0.0'

    // Add unshaded Kotlin for Jackson and your plugin code
    // These will be bundled (not relocated) so they work together
    implementation "org.jetbrains.kotlin:kotlin-reflect:1.9.25"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.25"

    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:2.18.2"

    testImplementation 'org.apache.groovy:groovy-all:4.0.23'
    testImplementation 'commons-validator:commons-validator:1.9.0'
    testImplementation 'io.rest-assured:rest-assured:5.5.0'
    testImplementation 'org.testng:testng:7.10.2'
    testImplementation 'org.yaml:snakeyaml:2.3'
}

shadowJar {
    archiveClassifier.set('')
    archiveBaseName.set('modelScannerPlugin')

    // Exclude signatures and other META-INF files that can cause issues
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    // Merge service files
    mergeServiceFiles()
}

build.dependsOn shadowJar

task packagePlugin(type: Zip, dependsOn: shadowJar) {
    archiveFileName = 'modelScannerPlugin.zip'
    destinationDirectory = file("$buildDir/distributions")

    from(shadowJar.outputs.files) {
        into 'lib'
    }
}

build.finalizedBy packagePlugin

test {
    useTestNG(){
        suites('src/test/groovy/testing.xml')
    }
    testLogging {
        showStandardStreams = true
    }
}

task copy_deps(type: Copy) {
    from shadowJar.outputs.files
    into 'build/deps'
}

task artifactory_common(type: Test) {
    useTestNG(){
        useDefaultListeners = true
        suites('src/test/groovy/testing.xml')
        includeGroups('common')
    }
    testLogging {
        showStandardStreams = true
    }
}

task modelscanner(type: Test) {
    useTestNG(){
        useDefaultListeners = true
        suites('src/test/groovy/testing.xml')
        includeGroups('model-scanner')
    }
    testLogging {
        showStandardStreams = true
    }
}
